name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and API surface
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          moon version --all

      - name: Verify formatting and exported interface
        shell: bash
        run: |
          set -euo pipefail
          moon fmt --check
          moon info
          git diff --exit-code -- pkg.generated.mbti

      - name: Test default target
        shell: bash
        run: |
          set -euo pipefail
          moon check --deny-warn
          moon test --deny-warn

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MoonBit (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check and test native debug and release profiles
        shell: bash
        run: |
          set -euo pipefail
          moon version --all
          moon check --target native --deny-warn
          moon test --target native --deny-warn
          moon check --target native --release --deny-warn
          moon test --target native --release --deny-warn

  cross-targets:
    name: ${{ matrix.target }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm, wasm-gc]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          moon version --all

      - name: Check and test target
        shell: bash
        run: |
          set -euo pipefail
          moon check --target "${{ matrix.target }}" --deny-warn
          moon test --target "${{ matrix.target }}" --deny-warn

  package:
    name: Package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Validate package contents
        shell: bash
        run: |
          set -euo pipefail
          moon package --list
